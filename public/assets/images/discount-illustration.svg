<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="55%" stop-color="#16205c"/>
      <stop offset="100%" stop-color="#0c1430"/>
    </linearGradient>
    <radialGradient id="gBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b4ee6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b4ee6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25c2d6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#25c2d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0a13a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f0a13a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badgeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5b950"/>
      <stop offset="100%" stop-color="#e9762f"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5365f5"/>
      <stop offset="100%" stop-color="#2a3bc4"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.35"/>
    </pattern>
    <radialGradient id="dotMaskGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <mask id="dotMask"><rect width="600" height="600" fill="url(#dotMaskGrad)"/></mask>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <ellipse cx="120" cy="120" rx="240" ry="220" fill="url(#gBlue)" filter="url(#soft)"/>
  <ellipse cx="510" cy="500" rx="240" ry="220" fill="url(#gCyan)" filter="url(#soft)"/>
  <ellipse cx="480" cy="100" rx="180" ry="160" fill="url(#gOrange)" filter="url(#soft)"/>

  <rect width="600" height="600" fill="url(#dots)" mask="url(#dotMask)" opacity="0.5"/>

  <g stroke="#ffffff" stroke-opacity="0.08" fill="none">
    <circle cx="300" cy="300" r="180"/>
    <circle cx="300" cy="300" r="240"/>
  </g>

  <g transform="translate(300 300)" filter="url(#badgeShadow)">
    <g>
      <path d="M 0 -150
               L 25 -135 L 53 -147 L 67 -120 L 96 -118 L 96 -88
               L 122 -73 L 110 -45 L 130 -22 L 105 0
               L 130 22 L 110 45 L 122 73 L 96 88 L 96 118
               L 67 120 L 53 147 L 25 135 L 0 150
               L -25 135 L -53 147 L -67 120 L -96 118 L -96 88
               L -122 73 L -110 45 L -130 22 L -105 0
               L -130 -22 L -110 -45 L -122 -73 L -96 -88 L -96 -118
               L -67 -120 L -53 -147 L -25 -135 Z"
            fill="url(#badgeFill)"/>
      <circle r="118" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
      <circle r="108" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    </g>

    <text x="0" y="-22" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-weight="900" font-size="58" fill="#ffffff" letter-spacing="-2">SAVE</text>
    <text x="0" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-weight="900" font-size="86" fill="#ffffff" letter-spacing="-3">30%</text>
    <text x="0" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-weight="800" font-size="18" fill="#ffffff" fill-opacity="0.85"
          letter-spacing="6">LIMITED OFFER</text>
  </g>

  <g transform="translate(300 460)">
    <path d="M -150 0 L -120 -30 L 120 -30 L 150 0 L 120 30 L -120 30 Z" fill="url(#ribbon)"/>
    <path d="M -150 0 L -180 28 L -150 30 L -120 0 Z" fill="#1d2a99"/>
    <path d="M 150 0 L 180 28 L 150 30 L 120 0 Z" fill="#1d2a99"/>
    <text x="0" y="7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-weight="900" font-size="20" fill="#ffffff" letter-spacing="5">DISCOUNT</text>
  </g>

  <g fill="#f5b950">
    <path d="M 86 76 l 4 12 l 12 4 l -12 4 l -4 12 l -4 -12 l -12 -4 l 12 -4 z" opacity="0.85"/>
    <path d="M 520 220 l 3 9 l 9 3 l -9 3 l -3 9 l -3 -9 l -9 -3 l 9 -3 z" opacity="0.7"/>
    <path d="M 470 520 l 3 9 l 9 3 l -9 3 l -3 9 l -3 -9 l -9 -3 l 9 -3 z" opacity="0.7"/>
  </g>
</svg>
